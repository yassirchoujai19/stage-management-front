server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: /internships is a client-side route, no such file exists on disk,
  # so serve index.html and let vue-router resolve it. Without this, F5 gives a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API: the browser calls /api/..., nginx forwards to the backend
  # container. No CORS config needed anywhere.
  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~* \.(js|css|woff2?|png|jpg|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
